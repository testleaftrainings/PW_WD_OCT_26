API → Application Programming Interface
----------------------------------------

An API (Application Programming Interface) is a mechanism that allows two software systems or 
applications to communicate and exchange data.

API Testing verifies the backend functionality by directly sending requests to APIs and 
validating. API testing can be performed without interacting with the UI.

Request
Response
Status code
Response body
Headers
Authentication
Data
Business logic



REST → Representational State Transfer
---------------------------------------

REST is an architectural style used for designing web services.
REST APIs commonly use standard HTTP methods to perform CRUD operations.

UI -> Customer facing interface
API -> Middle ware 

Five Steps process for API testing
------------------------------------

1. Documentation
: Understanding the API's purpose, structure, and usempId guidelines before testing.
Example: 
: Reading Swagger docs that describe how the incident API works in an application.

2. Endpoints: 
: Specific URLs that represent resources or actions to be tested.
Example: 
:https://hostname/services/oauth2/token

3. Methods: 
: HTTP operations (GET, POST, PATCH, PUT, DELETE, etc.) that define the type of action on the 
resource.
Example: 
: GET /incident → fetch incidents; POST /incident → create a new incident.

4. Headers: 
: Metadata sent with requests or responses to control and describe API behavior.
Example: 
Content-Type: application/json, Accept: application/json.

5. Authorization: 
: Security mechanism to verify and allow only valid users or systems to access the API.
Example: 
Authorization: Bearer <token> or Basic Auth with username & password.

Together, these 5 steps ensure your API test covers what, where, how, and who can access the service.
