 XPATH IN PLAYWRIGHT
================================================================================

ATTRIBUTE PRIORITY
================================================================================

When choosing attributes for locating elements, follow this priority order:

┌─────────────────────────────────────────────────────────────────────────────┐
│ Priority │ Attribute    │ Reason                                            │
├──────────┼──────────────┼───────────────────────────────────────────────────┤
│ 1️⃣       │ aria-label   │ Accessibility-based, stable, first choice        │
│ 2️⃣       │ id           │ Unique, fast                                     │
│ 3️⃣       │ name         │ Usually stable, not always unique                │
│ 4️⃣       │ class        │ For styling, changes often → least reliable      │
└──────────┴──────────────┴───────────────────────────────────────────────────┘

================================================================================
                    QUICK REFERENCE TABLE
================================================================================

┌─────────────────────────────────────────────────────────────────────────────┐
│ Axes Type              │ Symbol/Keyword │ Direction                        │
├────────────────────────┼────────────────┼──────────────────────────────────┤
│ Parent to Child        │ /              │ Top → Bottom                     │
│ Child to Parent        │ parent::       │ Bottom → Top                     │
│ GP to GC               │ //             │ Top → Bottom (multiple levels)   │
│ GC to GP               │ ancestor::     │ Bottom → Top (multiple levels)   │
│ Elder → Younger Sibling│ following-     │ Left → Right (same level)        │
│                        │ sibling::      │                                  │
│ Younger → Elder Sibling│ preceding-     │ Right → Left (same level)        │
│                        │ sibling::      │                                  │
│ Elder → Younger Cousin │ following::    │ Top → Bottom (different levels)  │
│ Younger → Elder Cousin │ preceding::    │ Bottom → Top (different levels)  │
└────────────────────────┴────────────────┴──────────────────────────────────┘


================================================================================
                    BEST PRACTICES - XPATH IN PLAYWRIGHT
================================================================================

✅ PREFER CSS Selectors over XPath when possible
  CSS selectors are faster and more readable

✅ USE Role-based locators when available
  getByRole(), getByText(), getByLabel()

✅ AVOID Absolute XPath
  Breaks easily with DOM changes

✅ USE Relative XPath with stable attributes
  id, name, aria-label, data-testid

✅ USE Contains for dynamic values
  //tag[contains(@id, 'partial')]

✅ USE Axes for complex relationships
  When elements don't have unique attributes

others:
-------

1) LAST CHILD
syntax:
-------
(xpath of parent)/child-tagName[last()]

<div>
    <input id="user">
    <input id="password">
    <input id="email">
</div>

ex: Xpath
//div/child::input[last()]    //o/p-> <input id="email">

2) USING ITEM INDEX
syntax:
------- 
(xpath)[index]

ex: (//input[@type='text'])[2]    //o/p-> Returns the 2nd matching input.

3) USING CHILD ITEM INDEX
syntax:
-------
(parent-xpath)/child::tagName[index]

ex: //form/child::input[3]

4) LAST CHILD

syntax:
(xpath of parent)/child::tagName[last()]
ex:
//form/child::input[last()]

5) LAST BUT ONE CHILD

syntax:
(xpath of parent)/child::tagName[last()-1]
ex:
//form/child::input[last()-1]   //Returns the second-last child.

6) FIRST CHILD

syntax:
(xpath of parent)/child::tagName[1]
ex:
//form/child::input[1]   //Returns the first child.

7) USING CHILD ITEM INDEX

(parent-xpath)/child-tagName[index]
ex: (parent-xpath)/child::tagName[index]

8) Using And condition
syntax:
//tagName[@att1='v1' and @att2='v2']

9)USING OR CONDITION
syntax:
//tagName[@att1='v1' or @att2='v2']

10) Using contains()

syntax: //tagName[contains(@attribute,'value')]
Ex: //input[contains(@id,'user')]

11) USING STARTS-WITH

syntax: //tagName[starts-with(@attribute,'value')]
ex: //input[starts-with(@id,'user')]

12) Using text
syntax: //tagName[text()='Exact Text']

ex: //button[text()='Login']

13) Normalize space

syntax:
//button[normalize-space()='Login'] //Works even if there are extra spaces/new lines.


